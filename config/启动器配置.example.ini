# DNF 联机启动器配置示例
# 复制成「启动器配置.ini」放在 exe 同目录，按自己的环境填写；不要提交到仓库。

# 房主的联机 IP（Radmin / ZeroTier 等虚拟网卡地址），朋友端填房主的 IP
IP=
HOSTIP=

# VMware 里服务端的地址（NAT 网段）
VMIP=192.168.200.131

# 工具目录 / 客户端目录（填自己的路径）
TOOLSDIR=
CLIENTDIR=D:\DNF\客户端
LAUNCHER=DOFLogin.exe
PYTHON=python\python.exe

# 是否部署假人系统
ROBOT=1
ROBOTPKG=
ROBOTREADY=1

# 服务端 SSH（密码不要提交）
SSHPORT=22
SSHUSER=root
SSHPWD=
GAMEDIR=/home/neople/game

# 假人管理面板密码（部署后请尽快修改）
ROBOTWEBPWD=

# VMware
VMRUN=C:\Program Files (x86)\VMware\VMware Workstation\vmrun.exe
VMX=D:\DNF\服务端\CentOS 7 64 bit.vmx
